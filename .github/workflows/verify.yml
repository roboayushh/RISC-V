name: Verify processor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys binutils-riscv64-linux-gnu
      - name: Directed regression
        run: bash run_tests.sh
      - name: Assembly images
        env:
          CROSS_COMPILE: riscv64-linux-gnu-
        run: bash scripts/build_branch_programs.sh --check
      - name: All module checks
        run: bash scripts/check_phase1_rtl.sh
      - name: Synthesis and behavioral acceptance
        run: bash synthesize.sh
